{% extends 'base.html' %}

{% block title %}Delete Lieu - GPI Ticketing{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">Delete Lieu: {{ lieu.name }}</h5>
            </div>
            <div class="card-body">
                <p>Are you sure you want to delete the lieu "{{ lieu.name }}"? This action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-danger">Yes, delete</button>
                        <a href="{% url 'lieu_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
