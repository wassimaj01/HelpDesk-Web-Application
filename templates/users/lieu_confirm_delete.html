{% extends 'base.html' %}

{% block title %}Supprimer un lieu - GPI Ticketing{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">Supprimer le lieu : {{ lieu.name }}</h5>
            </div>
            <div class="card-body">
                <p>Voulez-vous vraiment supprimer le lieu "{{ lieu.name }}" ? Cette action est irréversible.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-danger">Oui, supprimer</button>
                        <a href="{% url 'lieu_list' %}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
